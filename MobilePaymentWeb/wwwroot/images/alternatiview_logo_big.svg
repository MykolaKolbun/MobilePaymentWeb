<svg width="100%" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1d357"/>
      <stop offset="100%" stop-color="#70777d"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1d357" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#70777d" stop-opacity="0.6"/>
